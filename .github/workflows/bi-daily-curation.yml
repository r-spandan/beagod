name: BeAGod Autonomous 6AM/6PM BST Intelligence Pipeline

on:
  schedule:
    # 00:00 UTC = 6:00 AM BST | 12:00 UTC = 6:00 PM BST
    - cron: '0 0,12 * * *'
  push:
    branches: [ main ]
  workflow_dispatch: # Allows manual 1-click trigger anytime

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  curate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Autonomous AI Curation Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TZ: 'Asia/Dhaka'
        run: node scripts/curate.mjs

      - name: Commit & Push Updated Intelligence Database
        continue-on-error: true
        run: |
          git config --global user.name "BeAGod-AutoBot"
          git config --global user.email "bot@beagod.terminal"
          git add public/data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(intel): autonomous edition update [skip ci]" && git pull --rebase origin main && git push origin main) || true

      - name: Build Static Frontend
        run: npm run build

      - name: Deploy to InfinityFree via FTP (Automated Sync)
        if: env.INFINITYFREE_FTP_SERVER != ''
        env:
          INFINITYFREE_FTP_SERVER: ${{ secrets.INFINITYFREE_FTP_SERVER }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.INFINITYFREE_FTP_SERVER }}
          username: ${{ secrets.INFINITYFREE_FTP_USERNAME }}
          password: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
          server-dir: htdocs/
          local-dir: ./dist/

      - name: Upload Pages Artifact
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        continue-on-error: true
        uses: actions/deploy-pages@v4
